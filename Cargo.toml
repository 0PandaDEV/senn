[package]
name = "senn"
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0"
build = "build.rs"

[features]
default = ["server"]
server = [
  "dep:topcoat",
  "dep:tokio-stream",
  "dep:sqlx",
  "dep:reqwest",
  "dep:sha2",
  "dep:subtle",
  "dep:base64",
  "dep:bcrypt",
  "dep:getrandom",
  "dep:dotenvy",
  "dep:http",
  "dep:bytes",
]
agent = ["dep:bollard", "dep:tokio-tungstenite", "dep:clap", "dep:reqwest", "dep:base64", "dep:toml"]

[[bin]]
name = "senn"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "senn-agent"
path = "agent/main.rs"
required-features = ["agent"]

[dependencies]
topcoat = { version = "0.12.1", optional = true, default-features = false, features = [
  "compression",
  "asset",
  "cookie",
  "discover",
  "font",
  "fs",
  "icon-iconify",
  "metadata",
  "router",
  "runtime",
  "serve",
  "sse",
  "view",
  "websocket",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync", "process", "io-util"] }
tokio-stream = { version = "0.1.19", optional = true, features = ["sync"] }
sqlx = { version = "0.9.1", optional = true, default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio-tungstenite = { version = "0.30.0", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
bollard = { version = "0.21.1", optional = true }
clap = { version = "4.6.9", optional = true, features = ["derive"] }
toml = { version = "1.2.2", optional = true }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = { version = "1.0.3", features = ["serde"] }
futures = "0.3.34"
sha2 = { version = "0.11.1", optional = true }
subtle = { version = "2.6.1", optional = true }
base64 = { version = "0.23.1", optional = true }
bcrypt = { version = "0.19.3", optional = true }
getrandom = { version = "0.4.3", optional = true }
dotenvy = { version = "0.15.7", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = { version = "1.12.2", optional = true }
http = { version = "1.5.0", optional = true }

[build-dependencies]
topcoat = { version = "0.12.1", default-features = false, features = ["icon-iconify"] }
oxc_allocator = "0.160.0"
oxc_parser = "0.160.0"
oxc_span = "0.160.0"
oxc_semantic = "0.160.0"
oxc_transformer = "0.160.0"
oxc_codegen = "0.160.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
