name: Build and Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Cache topcoat-cli
        id: topcoat
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/topcoat
          key: topcoat-cli-0.12.1-${{ matrix.arch }}

      - name: Install topcoat-cli
        if: steps.topcoat.outputs.cache-hit != 'true'
        run: cargo install topcoat-cli --locked --version 0.12.1

      - name: Build senn
        run: |
          mkdir -p public styles
          cargo build --release --locked --bin senn
          topcoat asset bundle --release

      - name: Build senn-agent
        run: cargo build --release --locked --no-default-features --features agent --bin senn-agent

      - name: Collect files
        run: |
          mkdir dist
          cp target/release/senn target/release/senn-agent dist/
          cp -r target/release/assets dist/assets
          cp -r public dist/public
          cp -r styles dist/styles

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  docker:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [senn, senn-agent]

    steps:
      - name: Resolve image name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          if [ "${{ matrix.image }}" = "senn-agent" ]; then repo="${repo}-agent"; fi
          echo "IMAGE=${{ env.REGISTRY }}/${repo}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: artifacts

      - name: Create runtime Dockerfile
        run: |
          if [ "${{ matrix.image }}" = "senn" ]; then
            cat > artifacts/Dockerfile <<'EOF'
          FROM gcr.io/distroless/cc-debian12:nonroot
          ARG TARGETARCH
          WORKDIR /app
          COPY --chmod=755 dist-${TARGETARCH}/senn /app/senn
          COPY dist-${TARGETARCH}/assets /app/assets
          COPY dist-${TARGETARCH}/public /app/public
          COPY dist-${TARGETARCH}/styles /app/styles
          ENV HOST=0.0.0.0 PORT=3000
          EXPOSE 3000
          CMD ["/app/senn"]
          EOF
          else
            cat > artifacts/Dockerfile <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY --chmod=755 dist-${TARGETARCH}/senn-agent /senn-agent
          EOF
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: artifacts
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Changelog
        id: changelog
        uses: 0PandaDEV/changelog@main
        with:
          head: ${{ github.ref_name }}
          step-summary: "true"

      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: artifacts

      - name: Collect agent binaries
        run: |
          mkdir release
          for arch in amd64 arm64; do
            cp "artifacts/dist-${arch}/senn-agent" "release/senn-agent-linux-${arch}"
          done
          cd release
          sha256sum senn-agent-linux-* > checksums.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ steps.changelog.outputs.markdown }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" "${flags[@]}"
          fi
          gh release upload "$TAG" release/* --clobber
